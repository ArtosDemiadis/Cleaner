; ccleaner.ini — портативная конфигурация для CCleaner64.exe /AUTO
; Положите этот файл рядом с CCleaner64.exe (режим Portable).
; cleaner.py / Cleaner.bat запускают: CCleaner64.exe /AUTO
; Глубокая чистка реестра выполняется самим CCleaner по этому конфигу.
; Откат реестра: CCleaner сам предлагает .reg-бэкап перед исправлением,
; плюс cleaner.py экспортирует MRU-ветки в backup\<дата>\*.reg

[Options]
Language=1049
UpdateCheck=0
CheckForUpdates=0
HelpImproveCCleaner=0
Monitoring=0
SystemMonitoring=0
RunICSAtStartup=0
Branding=0
SkipUAC=1
; Не закрывать программу/ПК после автоочистки — меняйте при необходимости:
; ShutdownAfterCleaning=0

; --- Браузеры / интернет: куки, трекеры, кэш ---
(App)Cookies=True
(App)Internet Cache=True
(App)Internet History=True
(App)Recently Typed URLs=True
(App)Index.dat Files=True
(App)Last Download Location=True
(App)Autocomplete Form History=False
(App)Saved Passwords=False

; --- Windows: мусор и следы присутствия ---
(App)Temporary Files=True
(App)Recycle Bin=True
(App)Recent Documents=True
(App)Run (in Start Menu)=True
(App)Search Autocomplete=True
(App)Other Explorer MRUs=True
(App)Thumbnail Cache=True
(App)Clipboard=True
(App)Memory Dumps=True
(App)Chkdsk File Fragments=True
(App)Windows Log Files=True
(App)Old Prefetch data=False
(App)Menu Order Cache=True
(App)Tray Notifications Cache=True
(App)Window Size/Location Cache=True
(App)User Assist History=True
(App)Custom Files and Folders=True

; --- Реестр (CCleaner Registry Cleaner) ---
; Включаются все проверки: неиспользуемые расширения, ActiveX,
; отсутствующие DLL/приложения, устаревшие пути, MUI Cache и т.д.
CheckAC=True
CheckAPP=True
CheckAUD=True
CheckCLS=True
CheckEXT=True
CheckFONT=True
CheckHLP=True
CheckICO=True
CheckINS=True
CheckISS=True
CheckMSI=True
CheckMUIC=True
CheckOLD=True
CheckPAT=True
CheckSND=True
CheckSTA=True
CheckUSR=True
