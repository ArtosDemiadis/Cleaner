name: Build Cleaner.exe

# Сборка Windows .exe через PyInstaller на windows-раннере.
# Запуск: вручную (Actions -> Build Cleaner.exe -> Run workflow)
# или автоматически при пуше cleaner.py / этого файла в любую ветку.
on:
  workflow_dispatch:
  push:
    paths:
      - "cleaner.py"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Cleaner.exe (onefile, tkinter GUI)
        run: >
          pyinstaller --onefile --name Cleaner
          --hidden-import tkinter --hidden-import _tkinter
          cleaner.py

      - name: Smoke test (CLI must start and print help)
        shell: python
        run: |
          import os, subprocess, sys, traceback
          for _s in (sys.stdout, sys.stderr):
              try:
                  _s.reconfigure(encoding="utf-8", errors="replace")
              except Exception:
                  pass
          def note(title, text):
              esc = str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")[:3000]
              print(f"::error title={title}::{esc}", flush=True)
          try:
              print("dist:", os.listdir("dist"), flush=True)
              print("exe size:", os.path.getsize("dist/Cleaner.exe"), flush=True)
              for argv in (["dist/Cleaner.exe", "--help"],
                           ["dist/Cleaner.exe", "--dry-run", "--all", "--yes", "--no-ccleaner"]):
                  p = subprocess.run(argv, capture_output=True, text=True,
                                     encoding="utf-8", errors="replace", timeout=300)
                  print("$", *argv, "-> exit", p.returncode, flush=True)
                  print(p.stdout, flush=True)
                  print(p.stderr, file=sys.stderr, flush=True)
                  if p.returncode != 0:
                      note("smoke-failed", p.stdout + p.stderr)
                      sys.exit(1)
          except SystemExit:
              raise
          except BaseException:
              note("smoke-exception", traceback.format_exc())
              raise

      - name: Pack archive (exe + config + readme)
        shell: pwsh
        run: |
          Copy-Item ccleaner.ini dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/Cleaner.exe, dist/ccleaner.ini, dist/README.md -DestinationPath Cleaner-exe.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cleaner-exe
          path: |
            dist/Cleaner.exe
            Cleaner-exe.zip

      - name: Publish GitHub Release v1.0.1 with Cleaner.exe
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v1.0.1"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "Cleaner v1.0.1 (Cleaner.exe)" --notes "Cleaner.exe - двойной клик = GUI, Python не нужен. --no-geo: без проверки локации/страны (в самом Cleaner.exe ее нет; флаг не запускает внешний CCleaner64.exe). Cleaner.exe --no-geo --dry-run --all - CLI. CCleaner64.exe (опционально) положите рядом для глубокой чистки реестра."
          }
          gh release upload $tag dist/Cleaner.exe Cleaner-exe.zip --repo $env:GITHUB_REPOSITORY --clobber
